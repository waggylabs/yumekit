name: Publish

on:
    workflow_dispatch:
        inputs:
            dist-tag:
                description: "npm dist-tag to publish under"
                required: true
                type: choice
                default: beta
                options: [beta, latest]

permissions:
    id-token: write
    contents: read

jobs:
    # One definition of the gate, shared with the Release workflow.
    test:
        uses: ./.github/workflows/ci.yml

    publish-release:
        needs: test
        permissions:
            id-token: write
            contents: read
        uses: ./.github/workflows/npm-publish.yml
        with:
            tag: ${{ inputs.dist-tag }}
        secrets: inherit

    # Storybook documents the current release, so a beta does not replace it.
    deploy-storybook:
        needs: test
        if: inputs.dist-tag == 'latest'
        permissions:
            id-token: write
            contents: read
        uses: ./.github/workflows/deploy-storybook.yml
        secrets: inherit
