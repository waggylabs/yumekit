name: Publish

on:
    release:
        types: [published]

permissions:
    id-token: write
    contents: read

jobs:
    test:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4

            - uses: actions/setup-node@v4
              with:
                  node-version: 24

            - run: npm ci

            - name: Install Playwright browsers
              run: npx playwright install --with-deps chromium

            - run: npm test

    publish-beta:
        if: github.event.release.prerelease == true
        needs: test
        permissions:
            id-token: write
            contents: read
        uses: ./.github/workflows/npm-publish.yml
        with:
            tag: beta
        secrets: inherit

    publish-release:
        if: github.event.release.prerelease == false
        needs: test
        permissions:
            id-token: write
            contents: read
        uses: ./.github/workflows/npm-publish.yml
        secrets: inherit
