name: CI

on:
    push:
        branches: [main, dev]
    pull_request:
    workflow_call:
    workflow_dispatch:

# A newer push to the same branch or PR supersedes an in-flight run.
concurrency:
    group: ci-${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

permissions:
    contents: read

jobs:
    lint:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4

            - uses: actions/setup-node@v4
              with:
                  node-version: 24
                  cache: npm

            - run: npm ci

            - run: npx eslint .

    test:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4

            - uses: actions/setup-node@v4
              with:
                  node-version: 24
                  cache: npm

            - run: npm ci

            # The same three engines the release runs. Engine-specific failures
            # are the whole reason this job exists, so none of them is optional.
            - name: Install Playwright browsers
              run: npx playwright install --with-deps chromium firefox webkit

            - run: npm test

    build:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4

            - uses: actions/setup-node@v4
              with:
                  node-version: 24
                  cache: npm

            - run: npm ci

            - run: npm run build

            - run: npm run check:docs -- --check
